credentials:
  george@dhis2.org-Fridgetag-Gmail-account-George:
    name: Fridgetag Gmail account George
    owner: george@dhis2.org
  hunter@openfn.org-DHIS2-LMIS-Sandbox---DHIS2-Core-Team:
    name: DHIS2 LMIS Sandbox - DHIS2 Core Team
    owner: hunter@openfn.org
  hunter@openfn.org-GMail-Demo-Creds:
    name: GMail Demo Creds
    owner: hunter@openfn.org
  hunter@openfn.org-Hunters-Gmail:
    name: Hunters Gmail
    owner: hunter@openfn.org
  hunter@openfn.org-LMIS-Sandbox---HTTP:
    name: LMIS Sandbox - HTTP
    owner: hunter@openfn.org
